version: "3.9"
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    networks:
      - swiftroute-net

  redis:
    image: redis:7
    ports: ["6379:6379"]
    networks:
      - swiftroute-net

  rabbitmq:
    image: rabbitmq:3-management
    ports: ["5672:5672", "15672:15672"]
    networks:
      - swiftroute-net

  api-gateway:
    build: ./services/api-gateway
    ports: ["8000:8000"]
    networks:
      - swiftroute-net
    depends_on:
      - auth-service

  auth-service:
    build: ./services/auth-service
    ports: ["8081:8081"]
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=postgres
      - DB_USER=postgres
      - DB_PASSWORD=postgres
    networks:
      - swiftroute-net
    depends_on:
      - postgres
      - redis

networks:
  swiftroute-net:
    driver: bridge

volumes:
  pgdata: