services:
  # ── INFRASTRUCTURE ─────────────────────────────────────────────────────────
  postgres:
    image: postgres:16
    container_name: swiftroute-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-postgres}
      POSTGRES_USER: ${DB_USER:-openpg}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-openpgpwd}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro
    networks:
      - swiftroute-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-openpg} -d ${DB_NAME:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: swiftroute-redis
    ports:
      - "6379:6379"
    networks:
      - swiftroute-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: swiftroute-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - swiftroute-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── BACKEND SERVICES ───────────────────────────────────────────────────────
  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    container_name: swiftroute-api-gateway
    ports:
      - "8000:8000"
    environment:
      - AUTH_SERVICE_URL=http://auth-service:8081
      - ORDER_SERVICE_URL=http://order-service:8082
      - DRIVER_SERVICE_URL=http://driver-service:8083
      - ROUTING_ENGINE_URL=http://routing-engine:8084
      - PAYMENT_SERVICE_URL=http://payment-service:8085
      - JWT_SECRET=${JWT_SECRET:-your_super_secret_key_change_in_production}
    networks:
      - swiftroute-net
    depends_on:
      auth-service:
        condition: service_started
      order-service:
        condition: service_started
      driver-service:
        condition: service_started
      routing-engine:
        condition: service_started
      payment-service:
        condition: service_started

  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: swiftroute-auth-service
    ports:
      - "8081:8081"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-postgres}
      - DB_USER=${DB_USER:-openpg}
      - DB_PASSWORD=${DB_PASSWORD:-openpgpwd}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - JWT_SECRET=${JWT_SECRET:-your_super_secret_key_change_in_production}
    networks:
      - swiftroute-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  order-service:
    build:
      context: ./services/order-service
      dockerfile: Dockerfile
    container_name: swiftroute-order-service
    ports:
      - "8082:8082"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-postgres}
      - DB_USER=${DB_USER:-openpg}
      - DB_PASSWORD=${DB_PASSWORD:-openpgpwd}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - AUTH_SERVICE_URL=http://auth-service:8081
    networks:
      - swiftroute-net
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      auth-service:
        condition: service_started

  driver-service:
    build:
      context: ./services/driver-service
      dockerfile: Dockerfile
    container_name: swiftroute-driver-service
    ports:
      - "8083:8083"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-postgres}
      - DB_USER=${DB_USER:-openpg}
      - DB_PASSWORD=${DB_PASSWORD:-openpgpwd}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
    networks:
      - swiftroute-net
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  routing-engine:
    build:
      context: ./services/routing-engine-service
      dockerfile: Dockerfile
    container_name: swiftroute-routing-engine
    ports:
      - "8084:8084"
    environment:
      - RABBITMQ_URL=${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/}
      - ORDER_SERVICE_URL=${ORDER_SERVICE_URL:-http://order-service:8082}
    networks:
      - swiftroute-net
    depends_on:
      rabbitmq:
        condition: service_healthy

  payment-service:
    build:
      context: ./services/payment-service
      dockerfile: Dockerfile
    container_name: swiftroute-payment-service
    ports:
      - "8085:8085"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - PAYMENT_DB_NAME=payment_db
      - DB_USER=${DB_USER:-openpg}
      - DB_PASSWORD=${DB_PASSWORD:-openpgpwd}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
    networks:
      - swiftroute-net
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

networks:
  swiftroute-net:
    driver: bridge

volumes:
  pgdata:
