services:
  # ── INFRASTRUCTURE ─────────────────────────────────────────────────────────
  postgres:
    image: postgres:16
    container_name: swiftroute-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-postgres}
      POSTGRES_USER: ${DB_USER:-openpg}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-openpgpwd}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro
    networks:
      - swiftroute-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-openpg} -d ${DB_NAME:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: swiftroute-redis
    ports:
      - "6379:6379"
    networks:
      - swiftroute-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: swiftroute-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - swiftroute-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── BACKEND SERVICES ───────────────────────────────────────────────────────
  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    container_name: swiftroute-api-gateway
    ports:
      - "8000:8000"
    environment:
      - AUTH_SERVICE_URL=http://auth-service:8081
      - ORDER_SERVICE_URL=http://order-service:8082
      - DRIVER_SERVICE_URL=http://driver-service:8083
      - ROUTING_ENGINE_URL=http://routing-engine:8084
      - PAYMENT_SERVICE_URL=http://payment-service:8085
      - JWT_SECRET=${JWT_SECRET:-your_super_secret_key_change_in_production}
    networks:
      - swiftroute-net
    depends_on:
      auth-service:
        condition: service_started
      order-service:
        condition: service_started
      driver-service:
        condition: service_started
      routing-engine:
        condition: service_started
      payment-service:
        condition: service_started

  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: swiftroute-auth-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_FLYWAY_BASELINE_ON_MIGRATE=${SPRING_FLYWAY_BASELINE_ON_MIGRATE:-false}
      - AUTH_FLYWAY_BASELINE_VERSION=${AUTH_FLYWAY_BASELINE_VERSION:-1}
      - WEB_APP_URL=${WEB_APP_URL:-http://localhost:3000}
      - TENANT_INTERNAL_KEY=${TENANT_INTERNAL_KEY:-}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${AUTH_DB_NAME:-auth_db}
      - DB_USER=${DB_USER:-openpg}
      - DB_PASSWORD=${DB_PASSWORD:-openpgpwd}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET:-your_super_secret_key_change_in_production}
    networks:
      - swiftroute-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  order-service:
    build:
      context: ./services/order-service
      dockerfile: Dockerfile
    container_name: swiftroute-order-service
    ports:
      - "8082:8082"
    environment:
      - SPRING_FLYWAY_BASELINE_ON_MIGRATE=${SPRING_FLYWAY_BASELINE_ON_MIGRATE:-false}
      - ORDER_FLYWAY_BASELINE_VERSION=${ORDER_FLYWAY_BASELINE_VERSION:-1}
      - TENANT_INTERNAL_KEY=${TENANT_INTERNAL_KEY:-}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${ORDER_DB_NAME:-order_db}
      - DB_USER=${DB_USER:-openpg}
      - DB_PASSWORD=${DB_PASSWORD:-openpgpwd}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - AUTH_SERVICE_URL=http://auth-service:8081
      - DRIVER_SERVICE_URL=http://driver-service:8083
      - JWT_SECRET=${JWT_SECRET:-your_super_secret_key_change_in_production}
    networks:
      - swiftroute-net
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      auth-service:
        condition: service_started

  driver-service:
    build:
      context: ./services/driver-service
      dockerfile: Dockerfile
    container_name: swiftroute-driver-service
    ports:
      - "8083:8083"
    environment:
      - TENANT_INTERNAL_KEY=${TENANT_INTERNAL_KEY:-}
      - AUTH_SERVICE_URL=http://auth-service:8081
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DRIVER_DB_NAME:-driver_db}
      - DB_USER=${DB_USER:-openpg}
      - DB_PASSWORD=${DB_PASSWORD:-openpgpwd}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    networks:
      - swiftroute-net
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  routing-engine:
    build:
      context: ./services/routing-engine-service
      dockerfile: Dockerfile
    container_name: swiftroute-routing-engine
    ports:
      - "8084:8084"
    environment:
      - AUTH_SERVICE_URL=http://auth-service:8081
      - TENANT_INTERNAL_KEY=${TENANT_INTERNAL_KEY:-}
      - RABBITMQ_URL=${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/}
      - ORDER_SERVICE_URL=${ORDER_SERVICE_URL:-http://order-service:8082}
      - DRIVER_SERVICE_URL=${DRIVER_SERVICE_URL:-http://driver-service:8083}
      - ROUTING_DATABASE_URL=postgresql://${DB_USER:-openpg}:${DB_PASSWORD:-openpgpwd}@postgres:5432/routing_db
    networks:
      - swiftroute-net
    depends_on:
      rabbitmq:
        condition: service_healthy

  payment-service:
    build:
      context: ./services/payment-service
      dockerfile: Dockerfile
    container_name: swiftroute-payment-service
    ports:
      - "8085:8085"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - PAYMENT_DB_NAME=payment_db
      - DB_USER=${DB_USER:-openpg}
      - DB_PASSWORD=${DB_PASSWORD:-openpgpwd}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
    networks:
      - swiftroute-net
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  notification-service:
    build: ./services/notification-service
    container_name: swiftroute-notification-service
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-openpg}
      - DB_PASSWORD=${DB_PASSWORD:-openpgpwd}
      - NOTIFICATION_DB_NAME=notification_db
      - RABBITMQ_HOST=rabbitmq
      - JWT_SECRET=${JWT_SECRET:-your_super_secret_key_change_in_production}
      - SMTP_HOST=${SMTP_HOST:-host.docker.internal}
      - SMTP_PORT=${SMTP_PORT:-1025}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_AUTH=${SMTP_AUTH:-false}
      - SMTP_STARTTLS=${SMTP_STARTTLS:-false}
      - SMTP_FROM=${SMTP_FROM:-no-reply@swiftroute.local}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - swiftroute-net

networks:
  swiftroute-net:
    driver: bridge


volumes:
  pgdata:
