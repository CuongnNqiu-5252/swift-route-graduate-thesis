server:
  port: 8000

spring:
  dotenv:
    directory: ../../  # Đọc .env từ root project (cùng level với docker-compose.yml)
  application:
    name: api-gateway
  autoconfigure:
    exclude:
      # Loại bỏ UserDetailsService auto-config vì Gateway không quản lý user/session.
      # JWT verification tự xử lý bởi JwtAuthFilter + JwtVerifier.
      - org.springframework.boot.security.autoconfigure.ReactiveUserDetailsServiceAutoConfiguration
  cloud:
    gateway:
      server:
        webflux:
          routes:
            # --- Auth Service ---
            # Tất cả request /api/auth/** → auth-service:8081
            # Public paths (login, register, refresh) được phép qua SecurityConfig + JwtAuthFilter
            - id: auth-service
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/auth/**

            # --- Order Service ---
            # Tất cả request /api/orders/** → order-service:8082
            - id: order-service
              uri: ${ORDER_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/orders/**

            # --- Dispatch plans and live plan tracking (owned by Order Service) ---
            - id: dispatch-service
              uri: ${ORDER_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/dispatch/**

            - id: delivery-tasks-service
              uri: ${ORDER_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/delivery-tasks/**

            # --- Operator in-app notifications ---
            - id: notification-service
              uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8086}
              predicates:
                - Path=/api/notifications/**

            # --- Exception, return and COD operations ---
            - id: operations-service
              uri: ${ORDER_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/operations/**

            # --- Embedded Payment/COD ledger (owned by Order Service runtime) ---
            - id: cod-ledger
              uri: ${ORDER_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/cod/**

            # --- Package custody and dual-confirmation handovers ---
            - id: custody-service
              uri: ${ORDER_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/custody/**

            # --- File and Image Uploads (Cloudinary) ---
            - id: upload-service
              uri: ${ORDER_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/uploads/**

            # --- Tenant Memberships & Invitations (owned by Auth Service) ---
            - id: tenant-members-service
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/tenants/*/members/**

            # --- Tenant onboarding & Settings (owned by Order Service) ---
            - id: tenant-service
              uri: ${ORDER_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/tenants/**,/api/v1/tenants/**

            # --- Pickup Locations (owned by Order Service) ---
            - id: pickup-locations-service
              uri: ${ORDER_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/pickup-locations/**

            # --- Driver Service ---
            # /api/drivers/** → driver-service:8083
            # Gateway injects X-User-Id / X-User-Role / X-Tenant-Id from JWT
            - id: driver-service
              uri: ${DRIVER_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/drivers/**,/api/vehicles/**,/api/earnings/**,/api/settlements/**

            # --- Routing Engine Service (FastAPI) ---
            # /api/routing/** → routing-engine:8084
            - id: routing-engine
              uri: ${ROUTING_ENGINE_URL:http://localhost:8084}
              predicates:
                - Path=/api/routing/**
              filters:
                - StripPrefix=2

# JWT config — phải khớp với auth-service jwt.secret
jwt:
  secret: ${JWT_SECRET:your_super_secret_key_change_in_production}

# Logging config
logging:
  level:
    com.swiftroute.apigateway: DEBUG
    org.springframework.cloud.gateway: INFO
