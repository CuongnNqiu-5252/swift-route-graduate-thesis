server:
  port: 8086

spring:
  application:
    name: notification-service
  jackson:
    property-naming-strategy: SNAKE_CASE
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${NOTIFICATION_DB_NAME:notification_db}
    username: ${DB_USER:openpg}
    password: ${DB_PASSWORD:openpgpwd}
    driver-class-name: org.postgresql.Driver
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}

  flyway:
    enabled: true
    table: flyway_notification_history

jwt:
  secret: ${JWT_SECRET:your_super_secret_key_change_in_production}

auth-service:
  url: ${AUTH_SERVICE_URL:http://localhost:8081}
