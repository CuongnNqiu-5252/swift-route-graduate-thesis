server:
  port: 8081

spring:
  dotenv:
    directory: ../../
  application:
    name: auth-service
  jackson:
    property-naming-strategy: SNAKE_CASE
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${AUTH_DB_NAME:${DB_NAME:auth_db}}
    username: ${DB_USER:openpg}
    password: ${DB_PASSWORD:openpgpwd}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:true}
    baseline-version: ${AUTH_FLYWAY_BASELINE_VERSION:1}
    table: flyway_auth_history
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    publisher-confirm-type: correlated
    publisher-returns: true

jwt:
  secret: ${JWT_SECRET:your_super_secret_key_change_in_production}
  expiration: 86400000 # 24 hours in milliseconds
  access-token-expiry-minutes: 15
  refresh-token-expiry-days: 30

tenant:
  internal-key: ${TENANT_INTERNAL_KEY:}
verification:
  web-url: ${WEB_APP_URL:http://localhost:3000}
