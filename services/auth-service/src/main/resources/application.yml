server:
  port: 8081

spring:
  dotenv:
    directory: ../../
  application:
    name: auth-service
  jackson:
    property-naming-strategy: SNAKE_CASE
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}
    username: ${DB_USER:openpg}
    password: ${DB_PASSWORD:openpgpwd}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # Tạm thời để update để tự tạo bảng
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: false
    baseline-on-migrate: true
    baseline-version: 1
    table: flyway_auth_history
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}

jwt:
  secret: ${JWT_SECRET:your_super_secret_key_change_in_production}
  expiration: 86400000 # 24 hours in milliseconds
  access-token-expiry-minutes: 15
  refresh-token-expiry-days: 30
