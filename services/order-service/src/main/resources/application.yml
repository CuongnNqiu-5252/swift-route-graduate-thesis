server:
  port: 8082 # Port cho Order Service

spring:
  dotenv:
    directory: ../../ # Đọc .env từ root
  application:
    name: order-service
  jackson:
    property-naming-strategy: SNAKE_CASE

  # Cấu hình Database kết nối vào DB order_db
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${ORDER_DB_NAME:${DB_NAME:order_db}}
    username: ${DB_USER:openpg}
    password: ${DB_PASSWORD:openpgpwd}
    driver-class-name: org.postgresql.Driver

  # Cấu hình Hibernate
  jpa:
    hibernate:
      # Schema managed by Flyway — Hibernate only validates, never alters
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Cấu hình Flyway
  flyway:
    enabled: true
    baseline-on-migrate: false
    baseline-version: ${ORDER_FLYWAY_BASELINE_VERSION:1}
    locations: classpath:db/migration
    table: flyway_order_history

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    publisher-confirm-type: correlated
    publisher-returns: true

auth-service:
  url: ${AUTH_SERVICE_URL:http://localhost:8081}

jwt:
  secret: ${JWT_SECRET:your_super_secret_key_change_in_production}

# Tùy chỉnh log để dễ debug
logging:
  level:
    org.flywaydb: DEBUG
    com.example.orderservice: DEBUG

tenant:
  internal-key: ${TENANT_INTERNAL_KEY:}
driver-service:
  url: ${DRIVER_SERVICE_URL:http://localhost:8083}
