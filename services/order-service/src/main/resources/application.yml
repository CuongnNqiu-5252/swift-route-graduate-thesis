server:
  port: 8082 # Port cho Order Service

spring:
  dotenv:
    directory: ../../ # Đọc .env từ root
  application:
    name: order-service
  jackson:
    property-naming-strategy: SNAKE_CASE

  # Cấu hình Database kết nối chung vào DB swiftroute (như auth-service)
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}
    username: ${DB_USER:openpg}
    password: ${DB_PASSWORD:openpgpwd}
    driver-class-name: org.postgresql.Driver

  # Cấu hình Hibernate
  jpa:
    hibernate:
      # Schema managed by Flyway — Hibernate only validates, never alters
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Cấu hình Flyway
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    table: flyway_order_history

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}

auth-service:
  url: ${AUTH_SERVICE_URL:http://localhost:8081}

# Tùy chỉnh log để dễ debug
logging:
  level:
    org.flywaydb: DEBUG
    com.example.orderservice: DEBUG
