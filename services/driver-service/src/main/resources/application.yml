server:
  port: 8083

spring:
  dotenv:
    directory: ../../
  application:
    name: driver-service
  jackson:
    property-naming-strategy: SNAKE_CASE

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DRIVER_DB_NAME:${DB_NAME:driver_db}}
    username: ${DB_USER:openpg}
    password: ${DB_PASSWORD:openpgpwd}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    table: flyway_driver_history

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    publisher-confirm-type: correlated
    publisher-returns: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s

tracking:
  location-ttl-seconds: ${LOCATION_TTL_SECONDS:300}

outbox:
  publish-delay-ms: ${OUTBOX_PUBLISH_DELAY_MS:1000}

logging:
  level:
    org.flywaydb: DEBUG
    com.swiftroute.driverservice: DEBUG

tenant:
  internal-key: ${TENANT_INTERNAL_KEY:}

auth-service:
  url: ${AUTH_SERVICE_URL:http://localhost:8081}
